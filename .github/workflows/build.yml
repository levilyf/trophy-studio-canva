name: Build Canva app bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check app
        run: npm run typecheck
      - name: Build Canva app
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: trophy-studio-canva-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14
